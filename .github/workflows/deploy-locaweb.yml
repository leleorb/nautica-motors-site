name: Deploy Locaweb via FTP
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copia só os arquivos do site (sem .git e .github) pra pasta "publicar"
      - name: Preparar arquivos
        run: |
          mkdir publicar
          rsync -a --exclude='.git' --exclude='.github' --exclude='publicar' ./ publicar/

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "publicar"
          remoteDir: "public_html"
